limit_count: 0
note: >-
  Silent Push publishes NO numeric rate limits. The documentation states only
  that "the number of permitted API calls depends on your subscription level and
  any additional purchases" and that Silent Push emails the customer when the
  daily API limit is reached - a quota expressed as a commercial term, never as
  a published figure. No tier, window, burst or per-endpoint number appears
  anywhere on the public docs.

