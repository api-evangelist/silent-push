- name: Silent Push MCP Server
  description: >-
    SaaS-hosted Model Context Protocol server announced in Release 6.0
    (2026-06-12, beta). Exposes 33 read-only investigation tools across
    enrichment, PADNS, reputation, live scanning and SPQL fingerprinting to
    MCP-compatible AI clients such as Claude and Cursor. Authorized with OAuth
    2.1 (authorization code + PKCE S256, dynamic client registration) or a
    bearer token.
  humanURL: https://help.silentpush.com/docs/mcp-for-silent-push
