x-contract-note:
  finding: >-
    Silent Push DOES publish an OpenAPI - it is simply not readable without an
    account. GET https://api.silentpush.com/api/schema/ returns HTTP 401 with
    content-type application/vnd.oai.openapi (a drf-spectacular schema endpoint),
    and https://api.silentpush.com/api/docs/ 302s to login. Recorded here so a
    later round does not re-litigate "no spec": the spec exists, nothing was
    saved to openapi/, and every derived artifact in this repo is built from
    published documentation and live probes instead.
  probed: '2026-08-27'
  evidence:
  - url: https://api.silentpush.com/api/schema/
    status: 401
    content_type: application/vnd.oai.openapi
  - url: https://api.silentpush.com/api/docs/
    status: 302
    note: redirects to login
