aid: silent-push
name: Silent Push
description: >-
  Silent Push is a preemptive cyber defense company that maps adversary
  infrastructure before it is weaponized, using a continuously scanned view of
  the global DNS, web content, certificate and WHOIS landscape. Its platform
  turns that data into Indicators of Future Attack (IOFA), risk scores for
  domains and IP addresses, and threat intelligence feeds that security teams
  push into SIEM, SOAR and blocking infrastructure. The developer surface is a
  REST API gateway at api.silentpush.com covering enrichment, Passive Active DNS
  (PADNS), live web scanning and screenshots, SPQL search, feed and indicator
  CRUD, Threat Check, TLP reports and export in CSV, JSON, TXT, RPZ and STIX
  formats, authenticated with an x-api-key header. Silent Push also runs a hosted
  Model Context Protocol server that exposes 33 read-only investigation tools to
  MCP-compatible AI clients over OAuth 2.1.
