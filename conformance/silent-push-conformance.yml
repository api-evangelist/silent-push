domain_standards:
  market: threat intelligence / cyber defense
  contract_declared: unknown
  contract_declared_note: >-
    REWARD-ONLY CHECK, HONESTLY UNRESOLVED. domain_standard_conformance reads
    the contract for a domain-standard signature. Silent Push's contract is
    auth-gated, so whether the OpenAPI itself declares a STIX media type, a
    TAXII path or an RPZ response shape could not be observed. The signals below
    are documentation-level claims, recorded as such - they are NOT asserted as
    contract signatures.
  signals:
  - id: stix
    name: STIX (Structured Threat Information Expression)
    body: OASIS CTI
    claimed: true
    where: documentation
    evidence: >-
      "Export - Endpoints for downloading generated exports in various formats
      (CSV, JSON, TXT, RPZ, STIX, etc.)" - https://help.silentpush.com/docs/api
    version_stated: false
    note: >-
      STIX version (2.0 / 2.1) is not stated, so a consumer cannot tell which
      bundle shape they will receive without an account.
  - id: rpz
    name: DNS Response Policy Zones
    body: IETF (draft-vixie-dnsop-dns-rpz)
    claimed: true
    where: documentation
    evidence: same Export format list on https://help.silentpush.com/docs/api
    note: >-
      RPZ output is the interchange format that lets a Silent Push feed be
      loaded straight into a recursive resolver as a DNS firewall, with no
      bespoke connector.
  - id: tlp
    name: Traffic Light Protocol
    body: FIRST.org
    claimed: true
    where: documentation
    evidence: >-
      TLP Amber Reports are a first-class product surface with their own API
      section and docs page
      (https://help.silentpush.com/docs/tlp-amber-reports)
    note: >-
      TLP version (1.0 / 2.0) is not stated. Used as a handling-designation
      vocabulary, not as a wire format.
  - id: taxii
    name: TAXII
    body: OASIS CTI
    claimed: false
    evidence: >-
      No TAXII server, collection or discovery endpoint is mentioned anywhere in
      the public documentation. This is the most notable absence for this market
      - a threat-intel provider emitting STIX without a TAXII endpoint still
      requires a bespoke pull integration.
  - id: misp
    name: MISP
    claimed: false
    evidence: no MISP feed or module documented
  - id: openc2
    name: OpenC2
    claimed: false
  - id: stix-patterning
    name: STIX Patterning
    claimed: false
    note: Silent Push ships its own query language (SPQL) instead.

