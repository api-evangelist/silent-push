id_prefixes: []
id_prefixes_note: >-
  Silent Push uses no prefixed opaque identifiers. Entities are keyed on the
  natural observable itself (the domain name, the IP address, the ASN) plus
  content hashes (datahash, html_body_sha256, favicon_murmur3, jarm). That is
  the shape of the product: the join key IS the indicator.

fingerprint_keys:
  description: >-
    Hash and similarity fields that function as cross-entity join keys - the
    basis of Silent Push pivoting and of the SPQL find_by_* tools.
  keys: [favicon_md5, favicon_murmur3, favicon2_murmur3, favicon_avg, favicon2_avg,
    jarm, html_body_sha256, html_body_murmur3, html_body_ssdeep, body_sha256,
    header_sha256, footer_sha256, js_sha256, js_ssdeep, ssl.SHA1, ssl.SHA256,
    ssl.authority_key_id, ssl.subject_key_id, HHV, SHV, CHV, datahash]

