source: >-
  mcp/silent-push-mcp.yml (provider-published tool list) bound against the REST
  endpoints Silent Push documents publicly at
  https://help.silentpush.com/docs/silent-push-api-highlights,
  https://help.silentpush.com/docs/api and
  https://help.silentpush.com/apidocs/perform-a-live-scan
note: >-
  IMPORTANT PROVENANCE CAVEAT. The normal crosswalk binds each MCP tool to an
  OpenAPI operationId. Silent Push's OpenAPI is auth-gated - GET
  https://api.silentpush.com/api/schema/ returns 401 with content-type
  application/vnd.oai.openapi - so no operationIds are available and none have
  been invented. Rows below bind tools to the documented REST PATH instead, and
  confidence is set on how explicitly the docs tie the two together. MCP input
  schemas are likewise not introspected (tools/list is 401), so no tool here
  inherits a verified parameter contract.

surfaces:
  openapi:
    status: gated
    url: https://api.silentpush.com/api/schema/
    http_status: 401
    content_type: application/vnd.oai.openapi
    interactive_docs: https://api.silentpush.com/api/docs/
    interactive_docs_status: 302 (redirects to login)
    note: >-
      The schema endpoint exists and is served by drf-spectacular, but requires
      an authenticated Silent Push session. Nothing was saved to openapi/.
  rest_base: https://api.silentpush.com/api/v1/merge-api/
  rest_auth: 'x-api-key header'
  graphql:
    status: none
    note: no GraphQL surface found on any Silent Push host
  mcp:
    url: https://mcp.silentpush.com/mcp
    status: gated
    http_status: 401
    note: tools/list requires an OAuth bearer token
  postman:
