generated: '2026-08-27'
method: probed
status: published
source: https://help.silentpush.com/docs/mcp-for-silent-push
note: >-
  Silent Push announced the MCP Server in Release 6.0 (2026-06-12) as a
  "SaaS-hosted endpoint". The docs page publishes the capability/tool list but
  does not print the endpoint URL. The endpoint below was established by probe,
  not by guess-and-200: mcp.silentpush.com/mcp answers a JSON-RPC POST with a
  bespoke MCP auth challenge ("Missing or invalid Authorization header. Use:
  Authorization: Bearer <token>"), and the same host serves RFC 8414 OAuth 2.0
  Authorization Server Metadata at /.well-known/oauth-authorization-server whose
  issuer is https://mcp.silentpush.com. The host root 404s, so this is not a
  catch-all.

deployment:
  mode: remote
  endpoint: https://mcp.silentpush.com/mcp
  auth: oauth
  verified: probed

server:
  name: silent-push
  transport: http
  url: https://mcp.silentpush.com/mcp
  lifecycle_stage: beta
  announced_in: Release 6.0 (2026-06-12)

authorization:
  bearer_challenge: 'Missing or invalid Authorization header. Use: Authorization: Bearer <token>'
  oauth_metadata: well-known/silent-push-oauth-authorization-server.json
  issuer: https://mcp.silentpush.com
  authorization_endpoint: https://mcp.silentpush.com/oauth/authorize
  token_endpoint: https://mcp.silentpush.com/oauth/token
  registration_endpoint: https://mcp.silentpush.com/oauth/register
  grant_types: [authorization_code, refresh_token]
  pkce: S256
  dynamic_client_registration: true
  scopes_supported: null
  scopes_note: >-
    The authorization server metadata declares no scopes_supported, so no scope
    surface is published. scopes/ is deliberately not emitted for this provider.

introspection:
  tools_list: gated
  http_status: 401
  note: >-
    POST {"jsonrpc":"2.0","id":1,"method":"tools/list"} to the endpoint returns
    401 without a bearer token, so real inputSchema values require an
    authenticated MCP session. The tools below are the provider-published names
    and descriptions from the MCP docs page - names and grouping are verbatim,
    input schemas are NOT known and are not guessed.

tools_source: https://help.silentpush.com/docs/mcp-for-silent-push
tools_schema_status: not-introspected

